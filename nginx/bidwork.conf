server {
    listen 80;
    listen [::]:80;
    server_name bidwork.projexlight.com;

    # Client max body size for file uploads (S3 presigned puts, etc.)
    client_max_body_size 25M;

    # Stripe webhook — needs raw body, no proxy_buffering quirks
    location = /api/webhooks/stripe {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Static SPA assets — long cache, hashed filenames
    location /assets/ {
        root /opt/bidwork/client/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Admin SPA — served at /admin/. The admin-client is built with
    # vite `base: '/admin/'` so emitted asset URLs are /admin/assets/*.
    # `alias` is used (not `root`) so the URI prefix /admin/ is stripped
    # off before the filesystem lookup. try_files falls back to the SPA
    # index so React Router (basename="/admin") owns client-side routing.
    location /admin/ {
        alias /opt/bidwork/admin-client/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA fallback — all other paths return the main client's index.html
    location / {
        root /opt/bidwork/client/dist;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bidwork.projexlight.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bidwork.projexlight.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
